<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<style>
  body { margin: 0; font-family: system-ui, sans-serif; }
  #pad { display: block; width: 280px; height: 280px; background: #fff; border: 1px solid #ccc;
         border-radius: 6px; touch-action: none; cursor: crosshair; }
  button { margin-top: 8px; padding: 6px 14px; font: inherit; border: 1px solid #ccc; border-radius: 6px;
           background: #f5f5f5; cursor: pointer; }
</style></head>
<body>
<canvas id="pad" width="280" height="280"></canvas>
<button id="clear" type="button">Effacer</button>
<script>
/* Composant Streamlit minimal (protocole v1) : renvoie à Python une image PNG (data URL) du dessin. */
function send(type, data) {
  window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), "*");
}
var pad = document.getElementById("pad"), ctx = pad.getContext("2d"), drawing = false;
function blank() { ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, 280, 280); }
blank(); ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.lineWidth = 22; ctx.strokeStyle = "#000";
function pos(e) { var r = pad.getBoundingClientRect(); return [(e.clientX - r.left) * 280 / r.width, (e.clientY - r.top) * 280 / r.height]; }
pad.addEventListener("pointerdown", function (e) {
  drawing = true; pad.setPointerCapture(e.pointerId);
  var p = pos(e); ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(p[0] + 0.01, p[1]); ctx.stroke();
});
pad.addEventListener("pointermove", function (e) {
  if (!drawing) return;
  var p = pos(e); ctx.lineTo(p[0], p[1]); ctx.stroke(); ctx.beginPath(); ctx.moveTo(p[0], p[1]);
});
function fin() {
  if (!drawing) return; drawing = false;
  send("streamlit:setComponentValue", { value: pad.toDataURL("image/png"), dataType: "json" });
}
pad.addEventListener("pointerup", fin); pad.addEventListener("pointercancel", fin);
document.getElementById("clear").onclick = function () {
  blank(); send("streamlit:setComponentValue", { value: null, dataType: "json" });
};
send("streamlit:componentReady", { apiVersion: 1 });
send("streamlit:setFrameHeight", { height: 330 });
</script>
</body></html>
